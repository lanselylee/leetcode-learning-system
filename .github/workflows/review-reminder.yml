name: LeetCode Review Reminder

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  review-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check due reviews
        run: python3 scripts/review.py github-output --output "$GITHUB_OUTPUT"
        id: due

      - name: Sync reminder issue
        if: always()
        uses: actions/github-script@v7
        env:
          HAS_DUE: ${{ steps.due.outputs.has_due }}
          ISSUE_TITLE: ${{ steps.due.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.due.outputs.issue_body }}
        with:
          script: |
            const hasDue = process.env.HAS_DUE === 'true';
            const label = "leetcode-review";
            const today = new Date().toISOString().slice(0, 10);

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: "0969da",
                  description: "Spaced repetition reminders for LeetCode notes"
                });
              } else {
                throw error;
              }
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label
            });
            const openIssue = existing.data[0];

            if (hasDue) {
              const title = process.env.ISSUE_TITLE;
              const body = `${process.env.ISSUE_BODY}\n\n_Last updated: ${today}_`;

              if (openIssue) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  body
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  body: `🔔 Still due as of ${today}.`
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [label]
                });
              }
            } else if (openIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                body: "🎉 All caught up! Closing this reminder until the next review is due."
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                state: "closed"
              });
            }
